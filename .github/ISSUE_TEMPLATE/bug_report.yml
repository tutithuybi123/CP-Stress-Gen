name: Bug report
description: Report incorrect behavior, compilation problems, or documentation errors.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail to reproduce it with direct `g++` commands.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release version, branch, or commit SHA.
      placeholder: "v0.1.0 or commit SHA"
    validations:
      required: true
  - type: input
    id: compiler
    attributes:
      label: Compiler
      description: Compiler name and version.
      placeholder: "g++ 13.2"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest code sample and command that shows the issue.
      render: cpp
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Build or runtime output
      description: Paste compiler errors, test output, or logs.
      render: text
    validations:
      required: false
